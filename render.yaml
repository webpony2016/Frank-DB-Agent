services:
  - type: web
    name: frank-operations-demo
    runtime: python
    plan: free
    region: virginia
    branch: codex/frank-operations-demo
    buildCommand: pip install -r requirements.lock.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        sync: false
      - key: COOKIE_SECURE
        value: "true"
